[package]
name = "herdr-desktop-pet"
version = "0.1.11"
edition = "2021"
publish = false

[dependencies]
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = { version = "0.3", features = ["NSTimer", "NSDate"] }
objc2-quartz-core = "0.3"
png = "0.17"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[test]]
name = "composer_layout"
path = "tests/composer_layout.rs"
harness = false
