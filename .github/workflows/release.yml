name: Publish reviewed Herdr integration

# No tag/push/release trigger. Native publication and the legacy bridge are core
# operations; this workflow can create only a manually authorized assetless release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing public integration tag (v0.4.0 or later; never bridge/beta)
        required: true
        type: string
      reviewed_ref:
        description: Full reviewed immutable Herdr commit SHA selected by that tag
        required: true
        type: string
      authorization:
        description: Type hanbong5938/herdr-desktop-pet@ followed by reviewed_ref to authorize publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: herdr-integration-manual-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'hanbong5938/herdr-desktop-pet' && inputs.authorization == format('hanbong5938/herdr-desktop-pet@{0}', inputs.reviewed_ref)
    runs-on: macos-15
    environment: integration-release
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      INTEGRATION_TAG: ${{ inputs.tag }}
      REVIEWED_HERDR_REF: ${{ inputs.reviewed_ref }}
    steps:
      - name: Check out exact reviewed integration commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.reviewed_ref }}
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install Rust stable toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify independent integration closure
        run: bash scripts/verify-integration.sh
      - name: Authenticate reviewed notes, tag, ref and real core release metadata
        shell: bash
        run: bun scripts/integration-release.ts check "$INTEGRATION_TAG" "$REVIEWED_HERDR_REF"
      - name: Publish new integration Release without native assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HERDR_INTEGRATION_RELEASE_AUTHORIZATION: ${{ inputs.authorization }}
        run: bun scripts/integration-release.ts publish "$INTEGRATION_TAG" "$REVIEWED_HERDR_REF"
