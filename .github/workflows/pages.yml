name: Check and deploy Herdr Desktop Pet Pages

on:
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "tools/pages.mjs"
      - "tools/pages.test.ts"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "tools/pages.mjs"
      - "tools/pages.test.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herdr-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  preview:
    name: Check pull request and save review artifact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Test Pages server
        run: bun test tools/pages.test.ts

      - name: Check and stage public site files
        run: node tools/pages.mjs stage "$RUNNER_TEMP/herdr-pages"

      - name: Upload review artifact (not a deployed preview URL)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herdr-pages-review
          path: ${{ runner.temp }}/herdr-pages/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy reviewed main branch to Pages
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Test Pages server
        run: bun test tools/pages.test.ts

      - name: Check and stage public site files
        run: node tools/pages.mjs stage "$RUNNER_TEMP/herdr-pages"

      - name: Read existing Pages configuration without enabling it
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/herdr-pages/

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
