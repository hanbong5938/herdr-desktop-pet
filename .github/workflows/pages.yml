name: Stage and deploy Herdr integration Pages

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herdr-pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  stage:
    name: Stage static integration entrypoints
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Stage only the integration landing site
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/herdr-pages"
          mkdir "$output"
          # No app tooling, build, images, scripts or character assets belong here.
          for page in index.html en/index.html ja/index.html zh-Hans/index.html 404.html sitemap.xml; do
            test -f "site/$page" && test ! -L "site/$page"
            mkdir -p "$output/$(dirname "$page")"
            cp "site/$page" "$output/$page"
          done
          touch "$output/.nojekyll"

      - name: Upload review artifact (not a deployed preview URL)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: herdr-integration-pages-review
          path: ${{ runner.temp }}/herdr-pages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          github.event.repository.default_branch == 'main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/herdr-pages/

  deploy:
    name: Deploy main integration landing site
    needs: stage
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration without enabling it
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: false

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
