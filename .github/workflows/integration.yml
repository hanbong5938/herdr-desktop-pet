name: Verify Herdr integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: herdr-integration-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: macos-15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out integration source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Install Rust stable toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify consumer shell, Herdr hooks, locked adapter contracts and OMP TypeScript
        run: bash scripts/verify-integration.sh
