platforms = ["macos"]

[[actions]]
id = "bigger"
title = "Make desktop pet bigger"
contexts = ["global"]
command = ["./dist/HerdrDesktopPet.app/Contents/MacOS/herdr-desktop-pet", "bigger"]
platforms = ["macos"]

[[actions]]
id = "smaller"
title = "Make desktop pet smaller"
contexts = ["global"]
command = ["./dist/HerdrDesktopPet.app/Contents/MacOS/herdr-desktop-pet", "smaller"]
platforms = ["macos"]

